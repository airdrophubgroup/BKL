<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="50%" stop-color="#15102a"/>
      <stop offset="100%" stop-color="#0d0a1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c68ff"/>
      <stop offset="100%" stop-color="#5a2ef5"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <!-- Glow -->
  <circle cx="256" cy="240" r="120" fill="url(#accent)" opacity="0.15" filter="blur(40px)"/>
  <!-- Video camera icon -->
  <g transform="translate(160, 155)">
    <rect x="0" y="20" width="160" height="120" rx="20" fill="url(#accent)" opacity="0.9"/>
    <polygon points="160,40 220,10 220,150 160,120" fill="url(#accent)" opacity="0.9"/>
  </g>
  <!-- BK text -->
  <text x="256" y="320" font-family="Arial Black, sans-serif" font-size="80" font-weight="900" fill="white" text-anchor="middle" opacity="0.95">BK</text>
  <!-- Stars -->
  <g opacity="0.6">
    <circle cx="120" cy="100" r="4" fill="#7c68ff"/>
    <circle cx="400" cy="120" r="3" fill="#7c68ff"/>
    <circle cx="380" cy="380" r="3.5" fill="#5a2ef5"/>
    <circle cx="130" cy="400" r="3" fill="#5a2ef5"/>
  </g>
</svg>
