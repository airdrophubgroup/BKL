<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Beediyo Kall — Random Video Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            midnight: { 700: '#1e2a50', 800: '#131b36', 900: '#0a0f1f', 950: '#050810' },
            accent: { 400: '#7c68ff', 500: '#6c47ff', 600: '#5a2ef5' },
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body { height:100%; overflow:hidden; font-family:'Inter',sans-serif; background:#0a0f1f; color:#fff; -webkit-font-smoothing:antialiased; }
    body { background: linear-gradient(180deg, #0a0f1f 0%, #0f1629 40%, #131b36 100%); }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:4px; }

    @keyframes shimmer { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    @keyframes pulse-glow { 0%,100%{box-shadow:0 0 20px rgba(108,71,255,0.2)} 50%{box-shadow:0 0 40px rgba(108,71,255,0.4)} }
    @keyframes lip-sync { 0%{height:3px} 100%{height:12px} }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    .glass { background:rgba(255,255,255,0.08); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.12); }
    .glass-heavy { background:rgba(255,255,255,0.12); backdrop-filter:blur(30px); border:1px solid rgba(255,255,255,0.15); }
    .shimmer-bg { background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.06) 50%,transparent 100%); background-size:200% 100%; animation:shimmer 3s ease-in-out infinite; }
    .glow-ring { box-shadow:0 0 30px rgba(108,71,255,0.2),0 0 60px rgba(108,71,255,0.1),0 4px 20px rgba(0,0,0,0.3); }
    .float { animation:float 3s ease-in-out infinite; }
    .particle { position:absolute; border-radius:50%; background:radial-gradient(circle,rgba(108,71,255,0.3) 0%,transparent 70%); animation:float 4s ease-in-out infinite; pointer-events:none; }
    .lip-bar { width:2px; background:rgba(255,255,255,0.5); border-radius:2px; animation:lip-sync 0.4s ease-in-out infinite alternate; }
  </style>
</head>
<body>
  <div id="app" class="h-screen flex flex-col overflow-y-auto relative" style="-webkit-overflow-scrolling:touch">
    <!-- Particles -->
    <div id="particles" class="absolute inset-0 overflow-hidden pointer-events-none"></div>

    <!-- Header -->
    <div class="relative px-4 pt-6 pb-3 text-center space-y-1">
      <div class="flex items-center justify-center gap-2">
        <svg class="w-5 h-5 text-accent-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/></svg>
        <h1 class="text-2xl font-bold text-white tracking-tight">Beediyo Kall</h1>
        <svg class="w-5 h-5 text-accent-400" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2z"/></svg>
      </div>
      <p class="text-[11px] text-white/30 tracking-widest uppercase font-medium">Random Video Chat</p>
    </div>

    <!-- User greeting -->
    <div class="relative px-4 pb-2 text-center">
      <p class="text-white/40 text-[10px] uppercase tracking-widest">Welcome back,</p>
      <div class="flex items-center justify-center gap-2 mt-0.5">
        <p class="text-white text-lg font-bold">Priya_22</p>
        <div class="flex items-center gap-0.5 px-1.5 py-0.5 rounded-full bg-amber-400/15 text-amber-400 border border-amber-400/20 text-[8px] font-bold">
          <span>👑</span><span>GOLD</span>
        </div>
      </div>
    </div>

    <!-- Active Pass Card -->
    <div class="relative mx-4 mb-3">
      <div class="glass-heavy rounded-2xl p-4 space-y-3" style="animation:pulse-glow 2.5s ease-in-out infinite">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-accent-600/25 flex items-center justify-center border border-accent-500/15">
            <svg class="w-4 h-4 text-accent-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
          </div>
          <div class="flex-1"><p class="text-white font-bold text-sm">Advanced Pass</p><p class="text-white/35 text-[10px]">Active Pass</p></div>
          <div class="text-right">
            <div class="flex items-baseline gap-0.5">
              <span class="text-lg font-extrabold text-white tabular-nums">05</span><span class="text-white/30 text-[9px]">d</span>
              <span class="text-white/20 text-[10px]">:</span>
              <span class="text-lg font-extrabold text-white tabular-nums">12</span><span class="text-white/30 text-[9px]">h</span>
            </div>
          </div>
        </div>
        <div class="flex flex-wrap gap-1">
          <span class="px-2 py-0.5 rounded-md bg-white/[0.05] text-[8px] text-white/40 uppercase tracking-wider font-medium">random matching</span>
          <span class="px-2 py-0.5 rounded-md bg-white/[0.05] text-[8px] text-white/40 uppercase tracking-wider font-medium">gender filter</span>
          <span class="px-2 py-0.5 rounded-md bg-white/[0.05] text-[8px] text-white/40 uppercase tracking-wider font-medium">country filter</span>
          <span class="px-2 py-0.5 rounded-md bg-accent-500/10 text-[8px] text-accent-400 uppercase tracking-wider font-bold">+10 BKL</span>
        </div>
      </div>
    </div>

    <!-- BKL Token Balance -->
    <div class="relative mx-4 mb-3">
      <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-[#1a1040] via-[#15102a] to-[#0d0a1f] border border-white/[0.08] p-4">
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-accent-600/10 rounded-full blur-3xl"></div>
        <div class="relative flex items-center gap-3">
          <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-accent-500/20 to-indigo-600/20 border border-accent-500/20 flex items-center justify-center float">
            <span class="text-xl font-black bg-gradient-to-br from-accent-300 to-indigo-400 bg-clip-text text-transparent">B</span>
          </div>
          <div class="flex-1">
            <p class="text-white/40 text-[10px] uppercase tracking-widest font-medium">BKL Tokens</p>
            <div class="flex items-baseline gap-1.5">
              <span class="text-2xl font-extrabold text-white">37</span>
              <span class="text-xs text-white/30 font-medium">BKL</span>
            </div>
          </div>
          <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-green-500/10 border border-green-500/15">
            <svg class="w-3 h-3 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>
            <span class="text-[10px] text-green-400 font-semibold">Earned</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Demo Simulation -->
    <div class="mx-4 mb-4 rounded-2xl overflow-hidden border border-white/[0.08]">
      <div class="relative h-[260px] bg-gradient-to-br from-midnight-800 via-midnight-900 to-midnight-950">
        <div class="absolute inset-0 bg-gradient-to-br from-accent-600/8 via-transparent to-indigo-600/5" style="animation:float 8s ease-in-out infinite"></div>

        <!-- Characters -->
        <div class="absolute inset-0 flex items-center justify-center gap-6 px-6">
          <!-- Girl -->
          <div class="relative float" style="animation-delay:0s">
            <div class="w-20 h-20 rounded-full bg-gradient-to-br from-pink-400/30 to-rose-500/20 border-2 border-pink-400/30 flex items-center justify-center shadow-lg shadow-pink-500/10">
              <span class="text-3xl">👩</span>
            </div>
            <div class="absolute -bottom-1 -right-1 flex items-center gap-0.5 px-1.5 py-0.5 rounded-full bg-gradient-to-r from-amber-400/90 to-orange-400/90 border border-amber-300/50 shadow-sm shadow-amber-400/20">
              <span class="text-[8px]">👑</span><span class="text-[7px] font-bold text-amber-900">GOLD</span>
            </div>
            <div class="absolute top-0 right-0 w-3.5 h-3.5 rounded-full bg-green-500 border-2 border-midnight-900 shadow-sm shadow-green-500/30"></div>
            <p class="text-center text-[10px] text-white/50 mt-1.5 font-medium">Priya</p>
          </div>

          <!-- Connection -->
          <div class="flex items-center gap-1">
            <div class="w-8 h-0.5 bg-gradient-to-r from-pink-400 to-accent-400 rounded-full"></div>
            <span class="text-sm">💕</span>
            <div class="w-8 h-0.5 bg-gradient-to-r from-accent-400 to-blue-400 rounded-full"></div>
          </div>

          <!-- Boy -->
          <div class="relative float" style="animation-delay:0.5s">
            <div class="w-20 h-20 rounded-full bg-gradient-to-br from-blue-400/30 to-indigo-500/20 border-2 border-blue-400/30 flex items-center justify-center shadow-lg shadow-blue-500/10">
              <span class="text-3xl">👨</span>
            </div>
            <div class="absolute -bottom-1 -right-1 flex items-center gap-0.5 px-1.5 py-0.5 rounded-full bg-gradient-to-r from-slate-300/90 to-gray-400/90 border border-slate-200/50 shadow-sm shadow-slate-300/20">
              <span class="text-[8px]">🥈</span><span class="text-[7px] font-bold text-slate-700">SILVER</span>
            </div>
            <div class="absolute top-0 right-0 w-3.5 h-3.5 rounded-full bg-green-500 border-2 border-midnight-900 shadow-sm shadow-green-500/30"></div>
            <p class="text-center text-[10px] text-white/50 mt-1.5 font-medium">Arjun</p>
          </div>
        </div>

        <!-- Lip sync bars -->
        <div class="absolute bottom-16 left-8">
          <div class="flex items-center gap-1 px-2 py-1 rounded-full bg-pink-500/15 border border-pink-500/20">
            <div class="lip-bar" style="animation-delay:0s"></div>
            <div class="lip-bar" style="animation-delay:0.1s"></div>
            <div class="lip-bar" style="animation-delay:0.2s"></div>
            <div class="lip-bar" style="animation-delay:0.15s"></div>
            <span class="text-[8px] text-pink-400/60 ml-1">lip-sync</span>
          </div>
        </div>
        <div class="absolute bottom-16 right-8">
          <div class="flex items-center gap-1 px-2 py-1 rounded-full bg-blue-500/15 border border-blue-500/20">
            <div class="lip-bar" style="animation-delay:0.05s;animation-duration:0.5s"></div>
            <div class="lip-bar" style="animation-delay:0.2s;animation-duration:0.5s"></div>
            <div class="lip-bar" style="animation-delay:0.3s;animation-duration:0.5s"></div>
            <div class="lip-bar" style="animation-delay:0.1s;animation-duration:0.5s"></div>
            <span class="text-[8px] text-blue-400/60 ml-1">lip-sync</span>
          </div>
        </div>

        <!-- Step text -->
        <div class="absolute bottom-4 left-0 right-0 text-center">
          <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-black/40 backdrop-blur-md border border-white/10">
            <div class="w-1.5 h-1.5 rounded-full bg-green-400" style="animation:pulse-glow 2s infinite"></div>
            <span class="text-[11px] text-white/70 font-medium" id="demo-text">Connected! 💕</span>
          </div>
        </div>

        <!-- Demo badge -->
        <div class="absolute top-3 left-3 flex items-center gap-1 px-2 py-1 rounded-full bg-black/30 backdrop-blur-md border border-white/10">
          <span class="text-[8px]">🎬</span><span class="text-[8px] text-white/50 font-medium">Demo</span>
        </div>
      </div>
    </div>

    <!-- Match Button -->
    <div class="mt-auto px-4 pb-4">
      <button class="relative w-full py-4 rounded-2xl font-bold text-lg bg-gradient-to-r from-accent-600 via-accent-500 to-indigo-600 text-white shadow-xl shadow-accent-900/30 overflow-hidden glow-ring">
        <div class="absolute inset-0 shimmer-bg opacity-60"></div>
        <div class="relative flex items-center justify-center gap-2.5">
          <div class="w-10 h-10 rounded-xl bg-white/20 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
          </div>
          <div class="text-left">
            <p class="text-sm font-bold leading-tight">Find Random Match</p>
            <p class="text-[10px] opacity-60 font-medium">Connect with someone worldwide</p>
          </div>
          <svg class="w-5 h-5 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="animation:float 1.5s ease-in-out infinite"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </div>
        <div class="absolute inset-0 rounded-2xl ring-1 ring-inset ring-white/10"></div>
      </button>
    </div>

    <!-- Bottom Nav -->
    <div class="fixed bottom-0 left-0 right-0 z-40">
      <div class="mx-4 mb-4 rounded-2xl bg-midnight-900/80 backdrop-blur-xl border border-white/[0.08] shadow-2xl shadow-black/40">
        <div class="flex items-center justify-around py-2">
          <button class="relative flex flex-col items-center gap-0.5 px-5 py-2" style="color:#7c68ff">
            <div class="absolute -top-1 w-8 h-0.5 rounded-full bg-accent-500"></div>
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span class="text-[10px] font-medium" style="color:#7c68ff">Home</span>
          </button>
          <button class="flex flex-col items-center gap-0.5 px-5 py-2 text-white/30">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"/></svg>
            <span class="text-[10px] font-medium">Passes</span>
          </button>
          <button class="flex flex-col items-center gap-0.5 px-5 py-2 text-white/30">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
            <span class="text-[10px] font-medium">Call</span>
          </button>
          <button class="flex flex-col items-center gap-0.5 px-5 py-2 text-white/30">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
            <span class="text-[10px] font-medium">Rank</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Support Button -->
    <div class="fixed bottom-20 right-4 z-50">
      <button class="w-11 h-11 rounded-full bg-white/[0.06] backdrop-blur-md border border-white/[0.1] flex items-center justify-center text-white/40 hover:bg-white/[0.1] hover:text-white/60 transition-all shadow-lg shadow-black/20">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
      </button>
    </div>
  </div>

  <script>
    // Create particles
    const pc = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 1 + Math.random() * 3;
      p.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${size}px;height:${size}px;animation-duration:${3+Math.random()*5}s;animation-delay:${Math.random()*3}s;opacity:${0.1+Math.random()*0.2}`;
      pc.appendChild(p);
    }

    // Cycle demo text
    const texts = [
      'She opens Beediyo Kall...',
      'Selects India, Age 22, Female',
      'Filter: Male, Age 22-25',
      'Finding match...',
      'Connected! 💕',
      'Having a great conversation...'
    ];
    let ti = 0;
    setInterval(() => {
      ti = (ti + 1) % texts.length;
      document.getElementById('demo-text').textContent = texts[ti];
    }, 2500);
  </script>
</body>
</html>
